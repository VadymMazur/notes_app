{% extends 'base.html' %}
{% block title %}Реєстрація{% endblock %}
{% block content %}
    <div class="container mt-5"><div class="row"><div class="col-md-6 offset-md-3"><div class="card"><div class="card-header"><h3 class="card-title">Реєстрація</h3></div><div class="card-body">
        <form method="post">{% csrf_token %}
            {% for field in form %}<div class="mb-3"><label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}
            <button type="submit" class="btn btn-primary">Зареєструватися</button>
        </form>
        <div class="mt-3"><p>Вже маєте обліковий запис? <a href="{% url 'login' %}">Увійти</a></p></div>
    </div></div></div></div></div>
{% endblock %}
